            --danger: #e74c3c;

        }

            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .main-title .orange {

        }

            color: #6c757d;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        header {
            background-color: var(--dark);
            color: white;
            padding: 20px; 
            border-radius: 10px;
            margin-bottom: 25px;

            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 100%;
            box-sizing: border-box; 
        }
        header h1 { margin: 0 0 5px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        header p { margin: 0; color: #aaa; font-size: 14px; }

        .selector-box {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            flex: 1 1 100%; 
            text-align: center;
        }
        
        @media (min-width: 768px) {
            .selector-box {
                flex: 0 0 auto; 
                text-align: right;
            }
        }

        .selector-box label { color: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .selector-box select {
            width: 220px;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
            background: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center; 
                text-align: center;
            }
            .selector-box {
                width: 100%; 
                text-align: center;
            }
            .selector-box select {
                width: 100%; 
            }
        }

        .grid-main {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        @media (max-width: 1024px) {
            .grid-main { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .card h2 { 
            margin: 0 0 20px 0; 
            font-size: 18px; 
            font-weight: 700;
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-header {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 25px 0 10px 0;
            padding: 8px 12px;
            color: white;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;

        .cat-moteur { background-color: var(--moteur-color); }

        .cat-train-avant { background-color: var(--train-av-color); }
        .cat-train-arriere { background-color: var(--train-ar-color); }

        table {
            width: 100%;

            margin-bottom: 15px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            vertical-align: middle;
        }

        th {

            font-weight: 600; 
            color: #666;
            text-transform: uppercase;
            font-size: 11px;
        }

        tr:hover td { background-color: #f9f9f9; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #444; }

            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;

        }
        button:hover { background-color: #cc0000; }
        button.secondary { background-color: #444; }
        button.secondary:hover { background-color: #222; }
    
        button.btn-reset {
            background-color: #555; padding: 5px 10px; font-size: 11px; width: auto; border-radius: 3px;

        }
        button.btn-reset:hover { background-color: var(--success); }
        
        button.btn-cancel-date {
            background-color: #7f8c8d; padding: 5px 8px; font-size: 11px; width: auto; border-radius: 3px;
            display: inline-block; text-transform: none;
        }
        button.btn-cancel-date:hover { background-color: #c0392b; }

        button.btn-delete-row {
            background-color: #e74c3c; padding: 4px 8px; font-size: 11px; width: auto; border-radius: 4px;
            text-transform: none; font-weight: normal; color: white; border: none; cursor: pointer;
        }
        button.btn-delete-row:hover { background-color: #c0392b; }
        
        button.btn-delete-car {
            background-color: #c0392b; padding: 5px 10px; font-size: 11px; width: 100%; border-radius: 4px;
            text-transform: uppercase; font-weight: bold; margin-top: 5px;
        }
        button.btn-delete-car:hover { background-color: #962d22; }

        .btn-add-piece {
            cursor: pointer; border: none; background: transparent; font-size: 12px; color: #555; width: 100%;
        }
        .btn-add-piece:hover { color: var(--primary); }

        .status {
            padding: 3px 6px; border-radius: 4px; color: white; font-weight: bold; display: inline-block; font-size: 10px; text-transform: uppercase;

        .status-ok { background-color: var(--success); }

            background-color: #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: none;

    .checkbox-row {
        display: flex !important;

        align-items: center !important;
        padding: 8px !important;
        border-bottom: 1px solid #ddd !important;

        }

        tr { page-break-inside: avoid; break-inside: avoid; }

</head>

            </div>

                    </div>
                    <div class="form-group">

                    </div>
                    <div class="form-group">

                    </div>
                    <div class="form-group">
                        <label for="duree">Temps de roulage (heures) :</label>
                        <input type="number" id="duree" step="0.01" min="0.01" placeholder="ex: 7.0" required>
                    </div>

                    <div class="form-group">

        </div>

            <div class="card">

                </div>

                                <th>Notes d'Atelier</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

    ];
    let hangar = {};
    let voitureCourante = "";

    function obtenirDateDuJour() { return new Date().toISOString().split('T')[0]; }

    onValue(ref(db, 'hangar'), (snapshot) => {
        hangar = snapshot.val() || {};
        if (!voitureCourante || !hangar[voitureCourante]) voitureCourante = Object.keys(hangar)[0] || "";
        rafraichirSelecteur();
        rafraichirCheckboxes();
        majAffichage();
    });

    function rafraichirSelecteur() {
        const select = document.getElementById("select-voiture");
        select.innerHTML = "";
        Object.keys(hangar).forEach(v => {
            let opt = document.createElement("option");
            opt.value = v; opt.textContent = v;
            if (v === voitureCourante) opt.selected = true;
            select.appendChild(opt);
        });
    }
    
    function rafraichirCheckboxes() {
        const container = document.getElementById("container-checkbox-voitures");
        if (!container) return; 
        
        container.innerHTML = ""; 
        Object.keys(hangar).forEach(nomVoiture => {
            container.innerHTML += `
                <div class="checkbox-row">
                    <span>${nomVoiture}</span>
                    <input type="checkbox" class="check-voiture" value="${nomVoiture}">
                </div>
            `;
        });
    }

    window.changerVoitureCourante = () => { 
        voitureCourante = document.getElementById("select-voiture").value; 
        majAffichage(); 
    };

    window.supprimerVoitureCourante = () => {
        if (!voitureCourante) return;
        if (confirm(`Êtes-vous sûr de vouloir supprimer la voiture ${voitureCourante} ?`)) {
            remove(ref(db, `hangar/${voitureCourante}`)).then(() => {
                voitureCourante = "";
                alert("Voiture supprimée.");
            });
        }
    };

    window.ajouterPiecePourCategorie = (cat) => {
        if (typeof db === 'undefined') {
            alert("Le système est en cours de chargement, réessaie dans une seconde.");
            return;
        }

        const nom = prompt("Nom de la pièce :");
        if (!nom) return;

            lim = parseFloat(prompt("Limite heures :")) || 100;
        }
        
        push(ref(db, `hangar/${voitureCourante}/pieces/`), { 
            cat: cat, 
            nom: nom, 
            limite: lim, 
            heuresActuelles: 0, 
            dernierChangement: "",
            note: "",
            historiqueChangements: [],
            ordre: 999
        }).then(() => {
            if (typeof majAffichage === 'function') majAffichage();
        });
    };
    
    window.supprimerPiece = (id) => {
        if (confirm("Supprimer cette pièce ?")) {
            remove(ref(db, `hangar/${voitureCourante}/pieces/${id}`));
        }
    };
    
    window.editerNotePiece = (id) => {
        const pieces = hangar[voitureCourante].pieces || {};
        const piece = pieces[id];
        if (!piece) return;
        
        const noteActuelle = piece.note || "";
        const nouvelleNote = prompt(`Ajouter/Modifier une note pour ${piece.nom} :`, noteActuelle);
        
        if (nouvelleNote !== null) { 
            update(ref(db, `hangar/${voitureCourante}/pieces/${id}`), { 
                note: nouvelleNote 
            });
        }
    };

    window.voirHistoriquePiece = (id) => {
        const piece = hangar[voitureCourante].pieces[id];
        if(!piece) return;
        
        const hist = piece.historiqueChangements || [];
        
        if (hist.length === 0) {
            alert(`Aucun historique de remplacement pour : ${piece.nom}`);
        } else {
            const datesFormatees = hist.map(item => {
                let d = typeof item === 'string' ? item : item.date;
                let n = typeof item === 'string' ? '' : (item.note || '');
                
                let dFormat = d;
                if (d && d.includes('-')) {
                    const [y, m, day] = d.split('-');
                    dFormat = `${day}/${m}/${y}`;
                }
                
                return n ? `${dFormat} (Note: ${n})` : `${dFormat}`;
            });
            alert(`🕒 Historique des changements pour ${piece.nom} :\n\n- ` + datesFormatees.join('\n- '));
        }
    };

    window.remplacerPiece = (id) => {
        const date = document.getElementById("date-input-" + id).value; 
        if (!date) return;
        
        const noteChangement = prompt("Ajouter une note pour ce changement (facultatif) :", "") || "";
        
        const piece = hangar[voitureCourante].pieces[id];
        let hist = piece.historiqueChangements ? [...piece.historiqueChangements] : [];
        
        hist.push({ date: date, note: noteChangement });

        update(ref(db, `hangar/${voitureCourante}/pieces/${id}`), { 
            heuresActuelles: 0, 
            dernierChangement: date,
            note: noteChangement,
            historiqueChangements: hist
        });
    };

    window.annulerDateChangement = (id) => {
        const piece = hangar[voitureCourante].pieces[id];
        let hist = piece.historiqueChangements ? [...piece.historiqueChangements] : [];
        
        if (hist.length > 0) {
            hist.pop(); 
        }
        
        let datePrecedente = "";
        let notePrecedente = "";

        if (hist.length > 0) {
            let dernier = hist[hist.length - 1];
            if (typeof dernier === 'string') {
                datePrecedente = dernier;
            } else {
                datePrecedente = dernier.date || "";
                notePrecedente = dernier.note || "";
            }
        }

        update(ref(db, `hangar/${voitureCourante}/pieces/${id}`), { 
            dernierChangement: datePrecedente,
            note: notePrecedente,
            historiqueChangements: hist
        });
    };

    window.supprimerCourse = function(index) {
        if (!confirm("Supprimer cette session ?")) return;
        
        let hist = [...hangar[voitureCourante].historique];
        hist.splice(index, 1);
        
        update(ref(db, `hangar/${voitureCourante}`), { historique: hist });
    };

                <h1 style="color: #e60000; margin: 0;">4-RACE - MAINTENANCE</h1>

        const style = document.createElement('style');
        style.innerHTML = `
            .category-header { page-break-after: avoid; }

            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: 'css' } 
        };
        
        html2pdf().set(opt).from(container).save();
    };

    window.genererPDFHistorique = function() {
        if (!voitureCourante || !hangar[voitureCourante]) return;
        
        const container = document.createElement('div');
        container.style.padding = "20px";
        container.style.fontFamily = "system-ui, sans-serif";

        const header = document.createElement('div');
        header.innerHTML = `
            <div style="border-bottom: 2px solid #e60000; margin-bottom: 20px; padding-bottom: 10px;">
                <h1 style="color: #e60000; margin: 0;">4-RACE - HISTORIQUE DES CHANGEMENTS</h1>
                <p style="margin: 0;">Voiture : <strong>${voitureCourante}</strong> | Date : ${new Date().toLocaleDateString()}</p>
            </div>

        container.appendChild(header);

        const table = document.createElement('table');
        table.style.width = "100%";

        table.innerHTML = `
            <thead>
                <tr>
                    <th style="border-bottom: 2px solid #ddd; padding: 8px; text-align: left; background-color: #fafafa; font-size: 13px; color: #666; text-transform: uppercase;">Catégorie</th>
                    <th style="border-bottom: 2px solid #ddd; padding: 8px; text-align: left; background-color: #fafafa; font-size: 13px; color: #666; text-transform: uppercase;">Pièce</th>
                    <th style="border-bottom: 2px solid #ddd; padding: 8px; text-align: left; background-color: #fafafa; font-size: 13px; color: #666; text-transform: uppercase;">Historique (Dates et Notes)</th>
                </tr>

            <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');

        const pieces = hangar[voitureCourante].pieces || {};
        let piecesArray = Object.values(pieces).filter(p => p && p.nom);
        
        piecesArray.sort((a, b) => {
            if (a.cat < b.cat) return -1;
            if (a.cat > b.cat) return 1;
            return (a.ordre || 0) - (b.ordre || 0);
        });

        let hasData = false;
        piecesArray.forEach(p => {
            let hist = p.historiqueChangements || [];
            let datesToShow = [...hist];
            
            if (datesToShow.length > 0) {
                hasData = true;
                let datesFormatees = datesToShow.map(item => {
                    let d = typeof item === 'string' ? item : item.date;
                    let n = typeof item === 'string' ? '' : (item.note || '');
                    
                    let dFormat = d;
                    if (d && d.includes('-')) {
                        const [y, m, day] = d.split('-');
                        dFormat = `${day}/${m}/${y}`;
                    }
                    
                    return n ? `<strong>${dFormat}</strong> <span style="color:#e67e22; font-size: 12px; font-style: italic;">(${n})</span>` : `<strong>${dFormat}</strong>`;

        if (!hasData) {
            tbody.innerHTML = `<tr><td colspan="3" style="padding: 15px; text-align: center; font-style: italic;">Aucun historique de changement enregistré pour cette voiture.</td></tr>`;

        container.appendChild(table);

            table { page-break-inside: auto; }

        const opt = { 
            margin: [10, 10, 10, 10],
            filename: `Historique_Pieces_${voitureCourante}.pdf`,

        html2pdf().set(opt).from(container).save();

    function convertirEnDate(dateStr) {
        if (!dateStr) return new Date(0);

        if (dateStr.includes('-')) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        } 
        else if (dateStr.includes('/')) {
            const [d, m, y] = dateStr.split('/').map(Number);
            return new Date(y, m - 1, d);
        }
        return new Date(0);
    }

    window.deplacerPiece = (id, direction, idCategorie) => {
        const pieces = hangar[voitureCourante].pieces || {};
        
        const clesParCategorie = {
            "Moteur": ["Moteur"],
            "Transmission": ["Transmission"],
            "Freins": ["Frein", "Freinage", "Freins"],
            "Train avant": ["Train avant"],
            "Train arrière": ["Train arrière"],
            "Habitacle": ["Habitacle"]
        };
        const clesAutorisees = clesParCategorie[idCategorie] || [];

        let piecesCat = Object.entries(pieces)
            .filter(([key, p]) => p && p.cat && clesAutorisees.includes(p.cat))
            .map(([key, p], index) => ({ key, ordre: p.ordre !== undefined ? p.ordre : index }));
            
        piecesCat.sort((a, b) => a.ordre - b.ordre);
        
        const indexActuel = piecesCat.findIndex(p => p.key === id);
        if (indexActuel < 0) return;
        
        const indexCible = indexActuel + direction;
        
        if (indexCible < 0 || indexCible >= piecesCat.length) return;
        
        const pieceActuelle = piecesCat[indexActuel];
        const pieceCible = piecesCat[indexCible];
        
        let tempOrdre = pieceActuelle.ordre;
        pieceActuelle.ordre = pieceCible.ordre;
        pieceCible.ordre = tempOrdre;
        
        const updates = {};
        updates[`hangar/${voitureCourante}/pieces/${pieceActuelle.key}/ordre`] = pieceActuelle.ordre;
        updates[`hangar/${voitureCourante}/pieces/${pieceCible.key}/ordre`] = pieceCible.ordre;
        
        update(ref(db), updates).catch(error => {
            console.error("Erreur lors de la réorganisation :", error);
        });
    };
    
    function majAffichage() {
        if (!voitureCourante || !hangar[voitureCourante]) return;
        
        document.getElementById("titre-voiture-alertes").textContent = voitureCourante;
        const container = document.getElementById("maintenance-tables-container");
        container.innerHTML = "";
        
        const groupes = [
            { id: "Moteur", titre: "⚙️ CATÉGORIE : MOTEUR", class: "cat-moteur", cles: ["Moteur"] },
            { id: "Transmission", titre: "⛓️ CATÉGORIE : TRANSMISSION", class: "cat-transmission", cles: ["Transmission"] },
            { id: "Freins", titre: "🛑 CATÉGORIE : FREINS", class: "cat-freins", cles: ["Frein", "Freinage", "Freins"] },
            { id: "Train avant", titre: "🚘 CATÉGORIE : TRAIN AVANT", class: "cat-train-avant", cles: ["Train avant"] },
            { id: "Train arrière", titre: "🏎️ CATÉGORIE : TRAIN ARRIÈRE", class: "cat-train-arriere", cles: ["Train arrière"] },
            { id: "Habitacle", titre: "💺 CATÉGORIE : HABITACLE", class: "cat-habitacle", cles: ["Habitacle"] }
        ];

        groupes.forEach(g => {
            let div = document.createElement("div");
            div.className = "category-header " + g.class;
            
            if (g.id === "Habitacle") div.style.backgroundColor = "#34495e"; 
            
            div.innerHTML = `<span style="color: white; font-weight: bold;">${g.titre}</span>`;
            
            let isHabitacle = (g.id === "Habitacle");
            
            let table = document.createElement("table");
            if (isHabitacle) {
                table.innerHTML = `<thead><tr><th>Pièce</th><th>Date Installation</th><th>Notes & Validité</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody>`;
            } else {
                table.innerHTML = `<thead><tr><th>Pièce</th><th>Heures faites</th><th>Limite (Quotas)</th><th>Temps restant</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody>`;
            }
            let tbody = table.querySelector("tbody");

            const pieces = hangar[voitureCourante].pieces || {}; 
            
            let piecesDeLaCategorie = Object.entries(pieces)
                .filter(([id, p]) => p && p.cat && g.cles.includes(p.cat))
                .map(([id, p], index) => ({ 
                    id: id, 
                    ...p, 
                    ordre: p.ordre !== undefined ? p.ordre : index 
                }));

            piecesDeLaCategorie.sort((a, b) => a.ordre - b.ordre);

            piecesDeLaCategorie.forEach((p) => {
                let id = p.id;
                let tr = document.createElement("tr");

                if (isHabitacle) {
                    let htmlNote = p.note ? `<span style="font-size:12px; color:#e67e22; font-weight:bold;">${p.note}</span>` : `<span style='color:#999; font-style:italic;'>Aucune note</span>`;
                    
                    tr.innerHTML = `
                        <td><strong>${p.nom || "Sans nom"}</strong></td>
                        <td><strong>${p.dernierChangement || '---'}</strong></td>
                        <td>${htmlNote}</td>
                        <td><span class="status status-ok">-</span></td>
                        <td>
                            <div class="action-cell">
                                <button class="btn-reset" onclick="deplacerPiece('${id}', -1, '${g.id}')" title="Monter">⬆️</button>
                                <button class="btn-reset" onclick="deplacerPiece('${id}', 1, '${g.id}')" title="Descendre">⬇️</button>
                                <button class="btn-reset" onclick="editerNotePiece('${id}')" title="Ajouter une note">📝</button>
                                <button class="btn-reset" onclick="voirHistoriquePiece('${id}')" title="Voir l'historique">🕒</button>
                                
                                <input type="date" id="date-input-${id}" class="table-date-input">
                                <button class="btn-reset" onclick="remplacerPiece('${id}')">🛠️</button>
                                <button class="btn-cancel-date" onclick="annulerDateChangement('${id}')">❌</button>
                                <button class="btn-delete-row" onclick="supprimerPiece('${id}')">🗑️</button>
                            </div>
                        </td>
                    `;
                } else {
                    let dateMontage = convertirEnDate(p.dernierChangement);
                    let heuresCalculees = (hangar[voitureCourante].historique || [])
                        .filter(s => convertirEnDate(s.date) >= dateMontage)
                        .reduce((total, s) => total + parseFloat(s.duree || 0), 0);
                    
                    let margeRestante = p.limite - heuresCalculees;
                    let seuilAlerte = p.limite * 0.15;
                    
                    let statutTexte = 'OK';
                    let statutClass = 'status-ok';
                    
                    if (margeRestante <= 0) {
                        statutTexte = 'Changement';
                        statutClass = 'status-danger';
                    } else if (margeRestante <= seuilAlerte) {
                        statutTexte = 'À prévoir';
                        statutClass = 'status-warn';
                    }

                    let htmlNote = p.note ? `<span style="display:block; font-size:11px; color:#e67e22; font-style:italic; margin-top:3px;">📝 ${p.note}</span>` : "";
                                
                    tr.innerHTML = `
                        <td>
                            <strong>${p.nom || "Sans nom"}</strong>
                            <span class="date-changement">${p.dernierChangement ? 'Montée le : ' + p.dernierChangement : 'Aucune date'}</span>
                            ${htmlNote}
                        </td>
                        <td>${heuresCalculees.toFixed(2)} h</td>
                        <td>${p.limite || 0} h</td>
                        <td>${margeRestante.toFixed(2)} h</td>
                        <td><span class="status ${statutClass}">${statutTexte}</span></td>
                        <td>
                            <div class="action-cell">
                                <button class="btn-reset" onclick="deplacerPiece('${id}', -1, '${g.id}')" title="Monter">⬆️</button>
                                <button class="btn-reset" onclick="deplacerPiece('${id}', 1, '${g.id}')" title="Descendre">⬇️</button>
                                <button class="btn-reset" onclick="editerNotePiece('${id}')" title="Ajouter une note">📝</button>
                                <button class="btn-reset" onclick="voirHistoriquePiece('${id}')" title="Voir l'historique">🕒</button>
                                
                                <input type="date" id="date-input-${id}" class="table-date-input">
                                <button class="btn-reset" onclick="remplacerPiece('${id}')">🛠️</button>
                                <button class="btn-cancel-date" onclick="annulerDateChangement('${id}')">❌</button>
                                <button class="btn-delete-row" onclick="supprimerPiece('${id}')">🗑️</button>
                            </div>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
            
            let trAjout = document.createElement("tr");
            let colspan = isHabitacle ? 5 : 6;
            trAjout.innerHTML = `<td colspan="${colspan}" style="text-align:center; background:#f0f0f0; padding: 10px;">
                <button class="btn-add-piece" onclick="ajouterPiecePourCategorie('${g.id}')">
                    ➕ Ajouter une pièce dans ${g.id}
                </button></td>`;
            tbody.appendChild(trAjout);
            container.appendChild(div);
            container.appendChild(table);
        });

        const tbodyCourse = document.querySelector("#table-course tbody");
        if (tbodyCourse) {
            tbodyCourse.innerHTML = "";
            const donneesVoiture = hangar[voitureCourante];
            const historique = donneesVoiture.historique || [];
            
            if (historique.length > 0) {
                historique.forEach((session, index) => {
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${session.date || '-'}</strong></td>
                        <td>${session.evenement || '-'}</td>
                        <td>${session.circuit || '-'}</td>
                        <td><strong>${session.duree || 0} h</strong></td>
                        <td>${session.notes || '-'}</td>
                        <td><button class="btn-delete-row" onclick="supprimerCourse(${index})">🗑️</button></td>
                    `;
                    tbodyCourse.appendChild(tr);
                });
            } else {
                tbodyCourse.innerHTML = "<tr><td colspan='6'>Aucune session enregistrée.</td></tr>";
            }
        }
    }
    
    document.getElementById("form-voiture").addEventListener("submit", (e) => {
        e.preventDefault();
        const nomVoiture = document.getElementById("new-voiture-nom").value.trim();
        
        if (!nomVoiture) return;
    
        set(ref(db, `hangar/${nomVoiture}`), {
            historique: [{ date: new Date().toISOString().split('T')[0], evenement: "Initialisation", circuit: "N/A", duree: 0, notes: "Création châssis" }],
            pieces: cataloguePiecesStandard 
        }).then(() => {
            alert("Châssis " + nomVoiture + " créé avec ses pièces standards !");
            document.getElementById("new-voiture-nom").value = "";
        }).catch((error) => {
            console.error("Erreur Firebase : ", error);
        });
    });
        
    document.getElementById("form-session").addEventListener("submit", async (e) => {
        e.preventDefault();
        const date = document.getElementById("date").value;
        const evenement = document.getElementById("event").value;
        const circuit = document.getElementById("circuit").value;
        const duree = parseFloat(document.getElementById("duree").value);
        const notes = document.getElementById("notes").value;
        const checkboxes = document.querySelectorAll(".check-voiture:checked");
    
        if (checkboxes.length === 0) { alert("Veuillez sélectionner au moins une voiture."); return; }
    
        for (const cb of checkboxes) {
            const nomVoiture = cb.value;
            const refHistorique = ref(db, `hangar/${nomVoiture}/historique`);
            
            try {
                const snapshot = await get(refHistorique);
                let hist = snapshot.val() || [];
                hist.push({ date, evenement, circuit, duree, notes });
                await update(ref(db, `hangar/${nomVoiture}`), { historique: hist });
            } catch (error) {
                console.error("Erreur lors de la mise à jour pour " + nomVoiture, error);
            }
        }
        
        alert("Sessions enregistrées !");
        document.getElementById("form-session").reset(); 
    });
</script>
